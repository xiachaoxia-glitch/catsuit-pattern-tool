[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catsuit-pattern"
version = "0.1.0"
description = "Automated latex catsuit pattern drafting (DXF) + geometric validation toolchain"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xiachaoxia-glitch" }]
keywords = ["pattern", "sewing", "dxf", "catsuit", "latex", "garment", "cad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: CAD",
]
dependencies = ["ezdxf>=1.3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
catsuit-generate = "generate_catsuit_pattern:main"
catsuit-validate = "validate_pattern:main"
catsuit-auto = "auto_pattern:main"

[tool.setuptools]
py-modules = ["generate_catsuit_pattern", "validate_pattern", "auto_pattern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
